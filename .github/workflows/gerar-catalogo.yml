# Gera o processos.json a partir da base e comita se algo mudou.
#
# O GitHub puxa; o Supabase não empurra. Assim nenhum segredo sai do lugar onde
# já mora: o token de escrita no repositório é o do próprio Actions, e a chave
# usada para ler a base é a publicável — a mesma que já está no navegador de
# quem abre o site. A chave de serviço não existe nesta história.
name: Gerar o catálogo

on:
  schedule:
    # De hora em hora, em dia útil, no horário de trabalho (UTC-3).
    - cron: "0 11-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gerar-catalogo
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar o processos.json da base
        env:
          SUPABASE_URL: https://yamixtmtgeockzxmmnsb.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'sb_publishable_8WzmTmKmNaAcxq1MnBqEcg_hgI3ldDm' }}
        run: python3 gerar.py .

      - name: Comitar, se mudou
        run: |
          if git diff --quiet -- processos.json; then
            echo "Nada mudou na base desde a última geração."
            exit 0
          fi
          quantos=$(python3 -c "import json;print(len(json.load(open('processos.json'))))")
          git config user.name "SPU-ProjetoseProcessos"
          git config user.email "139982345+SPU-ProjetoseProcessos@users.noreply.github.com"
          git add processos.json
          git commit -m "Catálogo atualizado da base: ${quantos} processos"
          git push
