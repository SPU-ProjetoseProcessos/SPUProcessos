<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Catálogo dos processos de trabalho mapeados da Secretaria do Patrimônio da União. Consulte o fluxo de cada processo.">
  <meta name="author" content="CGGES — Escritório de Processos / SPU">
  <meta name="theme-color" content="#1b2b85">
  <style>
    /* Reset equivalente ao que o visualizador de Artifact aplica, para a página
       se comportar igual publicada no GitHub Pages. */
    :root {
      color-scheme: light;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    body { margin: 0; font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
    img { max-width: 100%; }
    [hidden] { display: none !important; }
  </style>
<title>SPUProcessos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Raleway:wght@400;500;600;700&display=swap">
<style>
  /* Padrão visual SPUnet / gov.br. Lista única com filtros compactos; a ficha do processo abre em modal
     sobre a lista, preservando busca, filtros e posição. Página própria para "Como ler um fluxo". */
  :root {
    /* Azuis medidos no Glossário do MemóriaSPU: título #1b2b85, link #5992ed, faixa #e8f0ff. */
    --bg: #f0f2f5; --surface: #ffffff; --surface-2: #f0f2f5; --zebra: #fbfcfd;
    --border: #e2e6ec; --border-forte: #c4ccd6;
    --fg: #333333; --fg-muted: #5a6068;
    --accent: #1b2b85; --accent-escuro: #121d5e; --accent-claro: #5992ed; --accent-fg: #ffffff; --accent-soft: #e8f0ff;
    --ok: #168821; --meio: #9a6700; --off: #6b7280;
    --fin: #1b2b85; --sup: #a4601a;
    --marca-1: #1351b4; --marca-2: #2e9e4f; --marca-3: #f2b705; --marca-4: #e8771f;
    /* Paleta do Bizagi, como aparece no Guia de Modelagem de Processos (CGU). */
    --bpmn-inicio: #a9d18e; --bpmn-inicio-borda: #548235;
    --bpmn-fim: #c9807e; --bpmn-fim-borda: #953735;
    --bpmn-tarefa: #d6e0f5; --bpmn-tarefa-borda: #4472c4;
    --bpmn-gateway: #ffe699; --bpmn-gateway-borda: #bf9000;
    --bpmn-raia: #9aa3ae; --bpmn-traco: #404040; --bpmn-texto: #333333;
    --sombra: 0 1px 2px rgba(28,28,28,.05), 0 8px 24px -16px rgba(12,50,111,.35);
    --sombra-modal: 0 24px 64px -16px rgba(12,50,111,.45), 0 4px 12px rgba(0,0,0,.12);
    --fonte-ui: "Raleway", system-ui, -apple-system, "Segoe UI", sans-serif;
    --fonte-titulo: "Raleway", system-ui, -apple-system, sans-serif;
    --fonte-codigo: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1322; --surface: #171c2e; --surface-2: #1f2639; --zebra: #1a2032;
      --border: #2a3146; --border-forte: #3c445d;
      --fg: #e9ecf5; --fg-muted: #99a1b8;
      --accent: #8fb0f2; --accent-escuro: #b3c9f7; --accent-claro: #5992ed; --accent-fg: #0d1430; --accent-soft: #1a2244;
      --ok: #2f9e3c; --meio: #b07f12; --off: #5b6572;
      --fin: #8fb0f2; --sup: #e0a05c;
    --bpmn-traco: #c8cdd6; --bpmn-texto: #1c1c1c; --bpmn-raia: #6b7482;
      --bpmn-traco: #c8cdd6; --bpmn-texto: #1c1c1c; --bpmn-raia: #6b7482;
      --sombra: 0 1px 2px rgba(0,0,0,.45), 0 8px 24px -16px rgba(0,0,0,.85);
      --sombra-modal: 0 24px 64px -16px rgba(0,0,0,.8), 0 4px 12px rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1322; --surface: #171c2e; --surface-2: #1f2639; --zebra: #1a2032;
    --border: #2a3146; --border-forte: #3c445d;
    --fg: #e9ecf5; --fg-muted: #99a1b8;
    --accent: #8fb0f2; --accent-escuro: #b3c9f7; --accent-claro: #5992ed; --accent-fg: #0d1430; --accent-soft: #1a2244;
    --ok: #2f9e3c; --meio: #b07f12; --off: #5b6572;
    --fin: #8fb0f2; --sup: #e0a05c;
    --bpmn-traco: #c8cdd6; --bpmn-texto: #1c1c1c; --bpmn-raia: #6b7482;
    --sombra: 0 1px 2px rgba(0,0,0,.45), 0 8px 24px -16px rgba(0,0,0,.85);
    --sombra-modal: 0 24px 64px -16px rgba(0,0,0,.8), 0 4px 12px rgba(0,0,0,.5);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font-family: var(--fonte-ui); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  body.travado { overflow: hidden; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); }
  .interno { max-width: 1280px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  a { color: var(--accent); text-underline-offset: 2px; }
  a:hover { color: var(--accent-claro); }

  /* ---------- Cabeçalho ---------- */
  .topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; background: var(--surface); border-bottom: 1px solid var(--border); }
  .topo .interno { padding-block: 12px; display: flex; align-items: center; gap: 16px; }
  .marca { display: flex; align-items: center; gap: 11px; min-width: 0; cursor: pointer; background: none; border: 0; padding: 0; font: inherit; }
  .marca-texto { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-width: 0; }
  .marca-nome { font-family: var(--fonte-titulo); font-size: 23px; line-height: 1.1; letter-spacing: -.02em; white-space: nowrap; }
  .marca-nome b { font-weight: 700; color: var(--fg); }
  .marca-nome span { font-weight: 400; color: var(--accent); }
  .marca-barras { display: flex; align-items: flex-end; gap: 2px; height: 20px; flex: none; }
  .marca-barras i { width: 3px; border-radius: 1px; display: block; }
  .modulo { padding-left: 16px; border-left: 1px solid var(--border); min-width: 0; }
  .modulo strong { display: block; font-size: 15px; font-weight: 600; line-height: 1.25; }
  .modulo span { display: block; font-size: 12.5px; color: var(--fg-muted); line-height: 1.3; }
  .acoes-topo { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
  .btn-topo {
    font: inherit; font-size: 13.5px; font-weight: 500; color: var(--accent); background: none; border: 0;
    border-radius: 999px; padding: 7px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
  }
  .btn-topo:hover { background: var(--accent-soft); }
  .btn-topo svg { width: 16px; height: 16px; flex: none; }
  .btn-topo.contorno { border: 1px solid var(--accent); font-weight: 600; padding: 6px 16px; }
  .btn-topo.contorno:hover { background: var(--accent-soft); }

  /* ---------- Rodapé ---------- */
  a.btn-topo { text-decoration: none; }
  .rodape { border-top: 1px solid var(--border); background: var(--surface); margin-top: 32px; }
  .rodape .interno { padding-block: 26px; display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--fg-muted); }
  .rodape b { display: block; font-size: 14px; font-weight: 700; color: var(--fg); }
  .rodape .credito small { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-muted); margin-bottom: 3px; }

  /* ---------- Trilha ---------- */
  .trilha .interno { padding-block: 11px; display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--fg-muted); flex-wrap: wrap; }
  .trilha svg { width: 15px; height: 15px; color: var(--accent); flex: none; }
  .trilha .sep { color: var(--border-forte); }
  .trilha button { font: inherit; font-size: 13px; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; }
  .trilha button:hover { text-decoration: underline; }
  .trilha .atual { color: var(--fg); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- Filtros ---------- */
  .painel-filtros { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--sombra); margin-bottom: 16px; }
  .cabeca-filtros {
    width: 100%; display: flex; align-items: center; gap: 9px; font: inherit; font-size: 15px; font-weight: 600;
    color: var(--fg); background: none; border: 0; padding: 13px 16px; cursor: pointer; text-align: left;
  }
  .cabeca-filtros .chevron { color: var(--accent); transition: transform .15s; display: inline-flex; }
  .cabeca-filtros[aria-expanded="false"] .chevron { transform: rotate(-90deg); }
  .cabeca-filtros .quantos { margin-left: auto; font-size: 12.5px; font-weight: 500; color: var(--fg-muted); }
  .corpo-filtros { padding: 0 16px 15px; display: flex; flex-direction: column; gap: 12px; }

  .fila-filtros { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
  .filtro-busca { flex: 2 1 228px; }
  .campo-busca { position: relative; display: flex; align-items: center; }
  .campo-busca svg { position: absolute; left: 12px; width: 16px; height: 16px; color: var(--fg-muted); pointer-events: none; }
  #busca { width: 100%; font: inherit; font-size: 14.5px; color: var(--fg); background: var(--bg); border: 1px solid var(--border-forte); border-radius: 6px; padding: 8px 12px 8px 36px; }
  #busca:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  #busca::placeholder { color: var(--fg-muted); }
  .fila-chips { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .chips-ativos { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
  .chip-ativo { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 3px 5px 3px 9px; }
  .chip-ativo button { font: inherit; font-size: 14px; line-height: 1; background: none; border: 0; color: inherit; cursor: pointer; padding: 1px 4px; border-radius: 3px; }
  .btn-texto { font: inherit; font-size: 13.5px; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; flex: none; }
  .btn-texto:disabled { color: var(--fg-muted); cursor: default; text-decoration: none; }

  .filtro { position: relative; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .filtro[data-campo="tipo"] { flex: 1 1 132px; }
  .filtro[data-campo="macroNome"] { flex: 1.7 1 186px; }
  .filtro[data-campo="dono"] { flex: 1 1 136px; }
  .filtro[data-campo="unidade"] { flex: 1 1 126px; }
  .filtro[data-campo="mapeado"] { flex: 1.15 1 158px; }
  .filtro > label { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--fg-muted); }
  .seletor {
    font: inherit; font-size: 13.5px; text-align: left; color: var(--fg); background: var(--bg);
    border: 1px solid var(--border-forte); border-radius: 6px; padding: 8px 26px 8px 10px; width: 100%;
    cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative;
  }
  .seletor::after { content: "▾"; position: absolute; right: 9px; top: 50%; transform: translateY(-50%); color: var(--fg-muted); font-size: 11px; }
  .seletor[aria-expanded="true"] { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: -1px; }
  .seletor.ativo { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .painel {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 30;
    background: var(--surface); border: 1px solid var(--border-forte); border-radius: 6px;
    box-shadow: 0 10px 28px -12px rgba(0,0,0,.45); padding: 6px; max-height: 280px; overflow-y: auto; min-width: 215px;
  }
  .opcao { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 4px; cursor: pointer; font-size: 13.5px; }
  .opcao:hover { background: var(--surface-2); }
  .opcao input { accent-color: var(--accent); flex: none; margin: 0; }
  .opcao span { min-width: 0; overflow-wrap: anywhere; }
  .opcao small { margin-left: auto; color: var(--fg-muted); font-size: 12px; font-variant-numeric: tabular-nums; padding-left: 6px; }
  .painel-rodape { border-top: 1px solid var(--border); margin-top: 4px; padding: 6px 8px 2px; }

  .resumo { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--fg-muted); margin-bottom: 12px; }
  .resumo span { font-variant-numeric: tabular-nums; }
  .resumo b { color: var(--fg); font-weight: 600; }
  .ponto { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; }
  .p-fin { background: var(--fin); } .p-sup { background: var(--sup); }

  /* ---------- Tabela ---------- */
  .area { padding-block: 4px 48px; }
  .rolagem { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); box-shadow: var(--sombra); }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  thead th:nth-child(1) { width: 47%; }
  thead th:nth-child(2) { width: 21%; }
  thead th:nth-child(3) { width: 15%; }
  thead th:nth-child(4) { width: 17%; }
  thead th { text-align: left; padding: 0; background: var(--surface-2); border-bottom: 1px solid var(--border); white-space: nowrap; }
  .th-botao {
    width: 100%; font: inherit; font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
    color: var(--accent); background: none; border: 0; padding: 12px 14px; cursor: pointer; text-align: left;
    display: flex; align-items: center; gap: 6px;
  }
  .th-botao:hover { color: var(--accent-escuro); }
  .th-botao .seta { opacity: .35; font-size: 10px; }
  .th-botao.ordenando .seta { opacity: 1; }
  tbody tr { border-bottom: 1px solid var(--border); }
  tbody tr:nth-child(even) { background: var(--zebra); }
  tbody tr:last-child { border-bottom: 0; }
  tbody tr:hover { background: var(--accent-soft); }
  td { padding: 11px 14px; vertical-align: middle; }
  td.cel-processo { border-left: 4px solid var(--linha-cor); padding-left: 13px; }
  tr.t-fin { --linha-cor: var(--fin); } tr.t-sup { --linha-cor: var(--sup); }
  .cel-processo { min-width: 0; }
  .linha-nome { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: nowrap; }
  .nome { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
  .macro { font-size: 13.5px; min-width: 0; overflow-wrap: anywhere; }
  .macro small { display: block; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; margin-top: 1px; font-weight: 600; }
  .t-fin .macro small { color: var(--fin); } .t-sup .macro small { color: var(--sup); }
  .dono { font-size: 13.5px; white-space: nowrap; font-weight: 500; }
  .dono em { font-style: normal; color: var(--fg-muted); font-weight: 400; }

  .pilula { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .055em; text-transform: uppercase; border-radius: 4px; padding: 4px 9px; white-space: nowrap; color: #fff; }
  .pilula-sim { background: var(--ok); } .pilula-meio { background: var(--meio); } .pilula-nao { background: var(--off); }
  .pilula-fin { background: var(--fin); } .pilula-sup { background: var(--sup); }
  .pilula-vazia { background: none; color: var(--fg-muted); border: 1px solid var(--border-forte); }

  .acoes-linha { display: inline-flex; gap: 6px; flex: none; padding-top: 1px; }
  .btn-linha {
    display: inline-flex; align-items: center; gap: 5px; font: inherit; font-size: 12px; font-weight: 600; text-decoration: none;
    border-radius: 999px; padding: 3px 11px; white-space: nowrap; cursor: pointer; border: 1px solid transparent;
  }
  .btn-linha svg { width: 11px; height: 11px; flex: none; }
  .btn-fluxo { color: var(--accent); background: var(--accent-soft); }
  .btn-fluxo:hover { border-color: var(--accent); }
  .btn-ver { color: var(--fg-muted); background: none; border-color: var(--border-forte); }
  .btn-ver:hover { color: var(--accent); border-color: var(--accent); }

  .vazio { padding: 44px 20px; text-align: center; color: var(--fg-muted); }
  .vazio strong { display: block; color: var(--fg); font-size: 16px; margin-bottom: 6px; }

  /* ---------- Modal ---------- */
  dialog { border: 0; padding: 0; background: none; max-width: none; max-height: none; }
  dialog::backdrop { background: rgba(12, 28, 56, .55); backdrop-filter: blur(2px); }
  .caixa {
    background: var(--surface); color: var(--fg); border-radius: 12px; box-shadow: var(--sombra-modal);
    width: min(940px, calc(100vw - 32px)); max-height: min(86vh, 860px); display: flex; flex-direction: column; overflow: hidden;
  }
  .modal-topo { display: flex; align-items: center; gap: 10px; padding: 12px 14px 12px 18px; border-bottom: 1px solid var(--border); background: var(--surface-2); flex: none; }
  .modal-topo .cod { font-family: var(--fonte-codigo); font-size: 12.5px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
  .modal-nav { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--fg-muted); }
  .modal-nav button, .btn-fechar {
    font: inherit; font-size: 15px; width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
    background: var(--surface); border: 1px solid var(--border-forte); color: var(--accent); display: inline-flex; align-items: center; justify-content: center;
  }
  .modal-nav button:disabled { opacity: .4; cursor: default; }
  .btn-fechar { margin-left: 4px; border-color: transparent; background: none; color: var(--fg-muted); }
  .btn-fechar:hover { background: var(--surface); border-color: var(--border-forte); color: var(--fg); }
  .btn-fechar svg { width: 15px; height: 15px; }
  .modal-corpo { overflow-y: auto; padding: 20px; }
  .posicao { font-variant-numeric: tabular-nums; }

  .ficha-cabeca { border-left: 4px solid var(--linha-cor); padding-left: 14px; margin-bottom: 18px; }
  .ficha-cabeca h2 { font-family: var(--fonte-titulo); font-weight: 700; font-size: clamp(19px, 3.4vw, 25px); line-height: 1.22; }
  .ficha-cabeca p { margin: 7px 0 0; color: var(--fg-muted); max-width: 64ch; font-size: 14.5px; }
  .ficha-selos { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
  .ficha-cabeca.t-fin { --linha-cor: var(--fin); } .ficha-cabeca.t-sup { --linha-cor: var(--sup); }

  .ficha-acoes { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 18px; }
  .btn-arquivo { display: inline-flex; align-items: baseline; gap: 8px; font: inherit; font-size: 14px; font-weight: 600; text-decoration: none; background: var(--accent); color: var(--accent-fg); border: 1px solid transparent; border-radius: 999px; padding: 10px 18px; }
  .btn-arquivo span { font-family: var(--fonte-codigo); font-size: 11.5px; font-weight: 500; opacity: .85; }
  .btn-arquivo.secundario { background: none; color: var(--accent); border-color: var(--accent); }

  .ficha-grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; align-items: start; }
  .bloco h3 { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--fg-muted); margin-bottom: 10px; }
  .pares { display: grid; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .par { display: grid; grid-template-columns: minmax(104px, 42%) minmax(0, 1fr); gap: 12px; background: var(--surface); padding: 8px 11px; }
  .par dt { color: var(--fg-muted); font-size: 13px; }
  .par dd { margin: 0; min-width: 0; overflow-wrap: anywhere; font-size: 13.5px; }
  .ausente { color: var(--fg-muted); font-style: italic; font-size: 13px; }
  .nota { font-size: 12.5px; color: var(--fg-muted); margin: 9px 0 0; }
  .linha-tempo { list-style: none; margin: 0; padding: 0; }
  .linha-tempo li { display: grid; grid-template-columns: 80px 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--border); font-size: 13.5px; }
  .linha-tempo li:last-child { border-bottom: 0; }
  .linha-tempo time { font-family: var(--fonte-codigo); font-size: 12px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }

  /* ---------- Contato ---------- */

  /* ---------- Como ler um fluxo ---------- */
  .ajuda-intro { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 8px; padding: 20px; box-shadow: var(--sombra); margin-bottom: 18px; }
  .ajuda-intro h2 { font-family: var(--fonte-titulo); font-weight: 700; font-size: clamp(21px, 3.6vw, 27px); margin-bottom: 8px; }
  .ajuda-intro p { margin: 0; color: var(--fg-muted); max-width: 70ch; }
  .ajuda-exemplo { margin: 18px 0 0; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; overflow-x: auto; }
  .ajuda-exemplo svg { width: 100%; min-width: 660px; height: auto; display: block; }
  .ajuda-exemplo figcaption { margin-top: 10px; font-size: 12.5px; color: var(--fg-muted); min-width: 660px; }
  .passos { list-style: none; counter-reset: passo; margin: 18px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(226px, 1fr)); gap: 12px; }
  .passos li { counter-increment: passo; position: relative; padding-left: 34px; }
  .passos li::before { content: counter(passo); position: absolute; left: 0; top: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); font-size: 12.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .passos strong { display: block; font-size: 14px; }
  .passos span { display: block; font-size: 13px; color: var(--fg-muted); margin-top: 2px; }
  .ajuda-secao { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-muted); margin: 26px 0 12px; }
  .ajuda-fonte { margin: 20px 0 0; font-size: 12.5px; color: var(--fg-muted); }
  .elementos { display: grid; grid-template-columns: repeat(auto-fit, minmax(268px, 1fr)); gap: 14px; }
  .elemento { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; box-shadow: var(--sombra); display: flex; flex-direction: column; gap: 10px; }
  .elemento figure { margin: 0; background: var(--bg); border-radius: 6px; padding: 12px; display: flex; align-items: center; justify-content: center; min-height: 104px; }
  .elemento figure svg { width: 100%; max-width: 240px; height: auto; }
  .elemento svg { max-width: 100%; height: auto; }
  .elemento h3 { font-size: 15px; font-weight: 700; }
  .elemento p { margin: 0; font-size: 13.5px; color: var(--fg-muted); }

  /* ---------- Rodapé ---------- */

  @media (max-width: 780px) {
    .topo .interno { flex-wrap: wrap; gap: 10px; }
    .modulo { padding-left: 0; border-left: 0; width: 100%; order: 3; }
    .acoes-topo { margin-left: auto; }
    .btn-topo span { display: none; }
    .btn-topo.contorno span { display: inline; }
    .rolagem { border: 0; background: none; box-shadow: none; overflow-x: visible; }
    table, tbody, tr, td { display: block; width: 100%; }
    thead { display: none; }
    tbody tr, tbody tr:nth-child(even) { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--linha-cor); border-radius: 8px; padding: 13px 14px; margin-bottom: 10px; box-shadow: var(--sombra); }
    td { padding: 0; }
    td.cel-processo { border-left: 0; padding-left: 0; max-width: none; }
    td + td { margin-top: 7px; }
    td.cel-meta::before { content: attr(data-rotulo) ": "; color: var(--fg-muted); font-size: 13px; }
    .macro small { display: inline; } .macro small::before { content: " · "; }
    .linha-nome { flex-wrap: wrap; justify-content: flex-start; gap: 8px; }
    .acoes-linha { padding-top: 0; }
    .caixa { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; border-radius: 0; }
    .modal-corpo { padding: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="topo">
  <div class="interno">
    <button class="marca" id="ir-home" type="button" aria-label="Voltar para a lista de processos">
      <span class="marca-texto">
        <span class="marca-nome"><b>SPU</b><span>Processos</span></span>
      </span>
      <span class="marca-barras" aria-hidden="true">
        <i style="height:9px;background:var(--marca-1)"></i>
        <i style="height:15px;background:var(--marca-2)"></i>
        <i style="height:20px;background:var(--marca-3)"></i>
        <i style="height:13px;background:var(--marca-4)"></i>
        <i style="height:7px;background:var(--marca-1)"></i>
      </span>
    </button>
    <div class="modulo">
      <strong>Catálogo de Processos de Trabalho</strong>
      <span>Secretaria do Patrimônio da União</span>
    </div>
    <div class="acoes-topo">
      <a class="btn-topo" href="painel.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"></path><path d="M7 15v2M12 10v7M17 6v11"></path></svg>
        Painel
      </a>
      <button class="btn-topo" id="abre-ajuda" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h7v14H4z"></path><path d="M13 5h7v14h-7z"></path><path d="M11 12h2"></path></svg>
        Como ler um fluxo
      </button>
    </div>
  </div>
</header>

<nav class="trilha" aria-label="Trilha de navegação">
  <div class="interno" id="trilha-conteudo"></div>
</nav>


<main class="area">
  <div class="interno">

    <section id="tela-lista">
      <div class="painel-filtros">
        <button class="cabeca-filtros" id="alterna-filtros" type="button" aria-expanded="true" aria-controls="corpo-filtros">
          <span class="chevron" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"></path></svg></span>
          Filtros
          <span class="quantos" id="quantos"></span>
        </button>
        <div class="corpo-filtros" id="corpo-filtros">
          <div class="fila-filtros" id="fila-filtros">
            <div class="filtro filtro-busca">
              <label for="busca">Busca</label>
              <div class="campo-busca">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
                <input id="busca" type="search" autocomplete="off" placeholder="Nome, código ou descrição">
              </div>
            </div>
          </div>
          <div class="fila-chips" id="fila-chips" hidden>
            <div class="chips-ativos" id="chips"></div>
            <button class="btn-texto" id="limpar" type="button" disabled>Limpar filtros</button>
          </div>
        </div>
      </div>

      <div class="resumo" id="resumo"></div>

      <div class="rolagem">
        <table>
          <thead><tr id="cabecalho-tabela"></tr></thead>
          <tbody id="corpo"></tbody>
        </table>
        <div class="vazio" id="vazio" hidden>
          <strong>Nenhum processo encontrado</strong>
          Revise a busca ou limpe os filtros aplicados.
        </div>
      </div>
    </section>

    <section id="tela-ajuda" hidden></section>

  </div>
</main>


<footer class="rodape">
  <div class="interno">
    <span class="credito"><small>Desenvolvido por</small><b>CGGES — Escritório de Processos</b>Secretaria do Patrimônio da União</span>
    <span>SPUProcessos · Catálogo de Processos de Trabalho</span>
  </div>
</footer>

<script>
let PROCESSOS = [];   /* vem do processos.json, ao lado */

/* Gerencial foi fundido em Suporte na exibição; macroTipo guarda o valor de origem. */
const tipoDe = p => p.macroTipo === "Finalístico" ? "Finalístico" : "Suporte";

const FILTROS = [
  { id: "tipo",      rotulo: "Tipo",             valor: tipoDe },
  { id: "macroNome", rotulo: "Macroprocesso",    valor: p => p.macroNome },
  { id: "dono",      rotulo: "Dono do processo", valor: p => p.dono },
  { id: "unidade",   rotulo: "Unidade",          valor: p => p.unidade },
  { id: "mapeado",   rotulo: "Status do mapeamento", valor: p => p.mapeado }
];

const COLUNAS = [
  { id: "nome",      rotulo: "Processo",         ordena: p => p.nome },
  { id: "macroNome", rotulo: "Macroprocesso",    ordena: p => p.macroNome },
  { id: "dono",      rotulo: "Dono do processo", ordena: p => p.dono + "/" + p.unidade },
  { id: "mapeado",   rotulo: "Status do mapeamento", ordena: p => ({ "Mapeado": 0, "Em andamento": 1, "Não mapeado": 2 }[p.mapeado] ?? 3) }
];

const estado = { busca: "", selecao: {}, aberto: null, ordem: { campo: "nome", asc: true }, tela: "lista" };
let resultado = [];

const $ = sel => document.querySelector(sel);
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const normalizar = t => String(t == null ? "" : t).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const ancora = p => p.codigo.toLowerCase().replace(/\./g, "-") + "-" + p._i;
const classeTipo = p => tipoDe(p) === "Finalístico" ? "t-fin" : "t-sup";
const sufixoTipo = p => tipoDe(p) === "Finalístico" ? "fin" : "sup";

const ICONE_EXTERNO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M14 4h6v6"></path><path d="M20 4 10 14"></path><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"></path></svg>';
const ICONE_MAIS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>';
const ICONE_CASA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m3 10 9-7 9 7"></path><path d="M5 9v11h14V9"></path></svg>';

/* ---------- Trilha ---------- */
function desenharTrilha() {
  $("#trilha-conteudo").innerHTML = estado.tela === "ajuda"
    ? ICONE_CASA + '<button type="button" data-ir="lista">Início</button>' +
      '<span class="sep">›</span><span class="atual">Como ler um fluxo</span>'
    : ICONE_CASA + '<span class="atual">Início</span>';
}
$("#trilha-conteudo").addEventListener("click", e => { if (e.target.closest('[data-ir="lista"]')) irParaLista(); });
$("#ir-home").addEventListener("click", irParaLista);

/* ---------- Filtros ---------- */
function montarFiltros() {
  $("#fila-filtros").insertAdjacentHTML("beforeend", FILTROS.map(f => {
    const opcoes = [...new Set(PROCESSOS.map(f.valor).filter(Boolean))].sort((a, b) => a.localeCompare(b, "pt-BR"));
    return '<div class="filtro" data-campo="' + f.id + '">' +
      '<label id="rot-' + f.id + '">' + esc(f.rotulo) + '</label>' +
      '<button type="button" class="seletor" data-abre="' + f.id + '" aria-expanded="false" aria-labelledby="rot-' + f.id + '">Todos</button>' +
      '<div class="painel" id="painel-' + f.id + '" hidden>' +
        opcoes.map(o => {
          const n = PROCESSOS.filter(p => f.valor(p) === o).length;
          return '<label class="opcao"><input type="checkbox" data-campo="' + f.id + '" value="' + esc(o) + '">' +
            '<span>' + esc(o) + '</span><small>' + n + '</small></label>';
        }).join("") +
        '<div class="painel-rodape"><button type="button" class="btn-texto" data-limpa="' + f.id + '">Limpar este filtro</button></div>' +
      '</div></div>';
  }).join(""));
}

function alternarPainel(campo, fechar) {
  document.querySelectorAll(".painel").forEach(p => { p.hidden = true; });
  document.querySelectorAll(".seletor").forEach(b => b.setAttribute("aria-expanded", "false"));
  if (fechar) return;
  $("#painel-" + campo).hidden = false;
  document.querySelector('[data-abre="' + campo + '"]').setAttribute("aria-expanded", "true");
}

$("#fila-filtros").addEventListener("click", e => {
  const abre = e.target.closest("[data-abre]");
  if (abre) { alternarPainel(abre.dataset.abre, abre.getAttribute("aria-expanded") === "true"); return; }
  const limpa = e.target.closest("[data-limpa]");
  if (limpa) {
    delete estado.selecao[limpa.dataset.limpa];
    document.querySelectorAll('input[data-campo="' + limpa.dataset.limpa + '"]').forEach(i => { i.checked = false; });
    aplicar();
  }
});

$("#fila-filtros").addEventListener("change", e => {
  const campo = e.target.dataset.campo;
  if (!campo) return;
  const atual = estado.selecao[campo] || [];
  estado.selecao[campo] = e.target.checked ? [...atual, e.target.value] : atual.filter(v => v !== e.target.value);
  if (!estado.selecao[campo].length) delete estado.selecao[campo];
  aplicar();
});

document.addEventListener("click", e => { if (!e.target.closest(".filtro")) alternarPainel(null, true); });

$("#alterna-filtros").addEventListener("click", () => {
  const b = $("#alterna-filtros");
  const aberto = b.getAttribute("aria-expanded") === "true";
  b.setAttribute("aria-expanded", String(!aberto));
  $("#corpo-filtros").hidden = aberto;
});

function atualizarSeletores() {
  FILTROS.forEach(f => {
    const escolhidos = estado.selecao[f.id] || [];
    const botao = document.querySelector('[data-abre="' + f.id + '"]');
    botao.textContent = escolhidos.length === 0 ? "Todos"
      : escolhidos.length === 1 ? (escolhidos[0].length > 17 ? "1 selecionado" : escolhidos[0])
      : escolhidos.length + " selecionados";
    botao.classList.toggle("ativo", escolhidos.length > 0);
  });
}

/* ---------- Ordenação ---------- */
function montarCabecalho() {
  $("#cabecalho-tabela").innerHTML = COLUNAS.map(c => {
    const ativo = estado.ordem.campo === c.id;
    const seta = ativo ? (estado.ordem.asc ? "↑" : "↓") : "↕";
    return '<th scope="col"><button type="button" class="th-botao' + (ativo ? " ordenando" : "") + '" data-ordena="' + c.id + '">' +
      esc(c.rotulo) + '<span class="seta" aria-hidden="true">' + seta + '</span></button></th>';
  }).join("");
}

$("#cabecalho-tabela").addEventListener("click", e => {
  const b = e.target.closest("[data-ordena]");
  if (!b) return;
  const campo = b.dataset.ordena;
  if (estado.ordem.campo === campo) estado.ordem.asc = !estado.ordem.asc;
  else estado.ordem = { campo, asc: true };
  aplicar();
});

function ordenar(lista) {
  const col = COLUNAS.find(c => c.id === estado.ordem.campo) || COLUNAS[0];
  const sinal = estado.ordem.asc ? 1 : -1;
  return lista.slice().sort((a, b) => {
    const va = col.ordena(a), vb = col.ordena(b);
    const cmp = typeof va === "number" ? va - vb : String(va).localeCompare(String(vb), "pt-BR", { sensitivity: "base" });
    return cmp !== 0 ? cmp * sinal : a.nome.localeCompare(b.nome, "pt-BR", { sensitivity: "base" });
  });
}

/* ---------- Lista ---------- */
function aplicar() {
  const termo = normalizar(estado.busca).trim();
  const filtrados = PROCESSOS.filter(p => {
    for (const f of FILTROS) {
      const escolhidos = estado.selecao[f.id];
      if (escolhidos && escolhidos.length && !escolhidos.includes(f.valor(p))) return false;
    }
    if (!termo) return true;
    return normalizar([p.codigo, p.nome, p.descricao, p.macroNome, p.unidade, p.dono].join(" ")).includes(termo);
  });
  resultado = ordenar(filtrados);
  montarCabecalho();
  desenharLista();
  desenharChips();
  atualizarSeletores();
}

function desenharChips() {
  const partes = [];
  for (const [campo, valores] of Object.entries(estado.selecao)) {
    const f = FILTROS.find(x => x.id === campo);
    valores.forEach(v => partes.push('<span class="chip-ativo">' + esc(f.rotulo) + ': ' + esc(v) +
      '<button type="button" data-campo="' + campo + '" data-valor="' + esc(v) + '" aria-label="Remover ' + esc(v) + '">×</button></span>'));
  }
  $("#chips").innerHTML = partes.join("");
  $("#limpar").disabled = partes.length === 0 && !estado.busca;
  $("#fila-chips").hidden = partes.length === 0 && !estado.busca;
}

$("#chips").addEventListener("click", e => {
  const b = e.target.closest("[data-campo]");
  if (!b) return;
  const { campo, valor } = b.dataset;
  estado.selecao[campo] = (estado.selecao[campo] || []).filter(v => v !== valor);
  if (!estado.selecao[campo].length) delete estado.selecao[campo];
  document.querySelectorAll('input[data-campo="' + campo + '"]').forEach(i => { if (i.value === valor) i.checked = false; });
  aplicar();
});

$("#limpar").addEventListener("click", () => {
  estado.selecao = {}; estado.busca = "";
  $("#busca").value = "";
  document.querySelectorAll(".opcao input").forEach(i => { i.checked = false; });
  aplicar();
});

$("#busca").addEventListener("input", e => { estado.busca = e.target.value; aplicar(); });

function pilulaMapeado(m) {
  /* O dado já diz Mapeado / Em andamento / Não mapeado — nada a traduzir aqui. */
  const classe = m === "Mapeado" ? "pilula-sim" : m === "Em andamento" ? "pilula-meio" : "pilula-nao";
  return '<span class="pilula ' + classe + '">' + esc(m) + '</span>';
}

function desenharLista() {
  $("#corpo").innerHTML = resultado.map(p =>
    '<tr class="' + classeTipo(p) + '">' +
      '<td class="cel-processo">' +
        '<div class="linha-nome"><span class="nome">' + esc(p.nome) + '</span>' +
          '<span class="acoes-linha">' +
            (p.linkWeb ? '<a class="btn-linha btn-fluxo" href="' + esc(p.linkWeb) + '" target="_blank" rel="noopener">' + ICONE_EXTERNO + 'Abrir fluxo</a>' : '') +
            '<a class="btn-linha btn-ver" href="processo.html?id=' + p.id + '">' + ICONE_MAIS + 'Ver mais</a>' +
          '</span>' +
        '</div>' +
      '</td>' +
      '<td class="macro cel-meta" data-rotulo="Macroprocesso">' + esc(p.macroNome) + '<small>' + esc(tipoDe(p)) + '</small></td>' +
      '<td class="dono cel-meta" data-rotulo="Dono">' + esc(p.dono) + '<em>/' + esc(p.unidade) + '</em></td>' +
      '<td class="cel-meta">' + pilulaMapeado(p.mapeado) + '</td>' +
    '</tr>'
  ).join("");

  $("#vazio").hidden = resultado.length > 0;
  const n = resultado.length;
  $("#quantos").textContent = n === PROCESSOS.length ? PROCESSOS.length + " processos" : n + " de " + PROCESSOS.length + " processos";

  const porTipo = t => resultado.filter(p => tipoDe(p) === t).length;
  const conta = v => resultado.filter(p => p.mapeado === v).length;
  $("#resumo").innerHTML =
    '<span><i class="ponto p-fin"></i><b>' + porTipo("Finalístico") + '</b> finalísticos</span>' +
    '<span><i class="ponto p-sup"></i><b>' + porTipo("Suporte") + '</b> de suporte</span>' +
    '<span><b>' + conta("Mapeado") + '</b> mapeados</span>' +
    '<span><b>' + conta("Em andamento") + '</b> em andamento</span>' +
    '<span><b>' + conta("Não mapeado") + '</b> não mapeados</span>';
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape") alternarPainel(null, true);
});

/* ---------- Como ler um fluxo ----------
   Formas e cores seguem a notação BPMN como o Bizagi a desenha, igual ao
   Guia de Modelagem de Processos (CGU). O texto é voltado a quem lê o fluxo,
   não a quem o desenha. */

const EXEMPLO = '<svg viewBox="0 0 840 300" role="img" aria-label="Exemplo de fluxo com duas raias: requerente e SPU">' +
  '<rect x="30" y="8" width="806" height="112" fill="none" stroke="var(--bpmn-raia)" stroke-width="1.2"/>' +
  '<rect x="30" y="120" width="806" height="172" fill="none" stroke="var(--bpmn-raia)" stroke-width="1.2"/>' +
  '<rect x="4" y="8" width="26" height="284" fill="none" stroke="var(--bpmn-raia)" stroke-width="1.2"/>' +
  '<text x="-64" y="23" transform="rotate(-90)" text-anchor="middle" font-size="10" font-weight="600" fill="var(--bpmn-texto)">REQUERENTE</text>' +
  '<text x="-206" y="23" transform="rotate(-90)" text-anchor="middle" font-size="10" font-weight="600" fill="var(--bpmn-texto)">SPU</text>' +
  '<circle cx="80" cy="56" r="17" fill="var(--bpmn-inicio)" stroke="var(--bpmn-inicio-borda)" stroke-width="1.6"/>' +
  '<text x="80" y="88" text-anchor="middle" font-size="9.5" fill="var(--bpmn-texto)">requerimento</text>' +
  '<text x="80" y="99" text-anchor="middle" font-size="9.5" fill="var(--bpmn-texto)">enviado</text>' +
  '<path d="M99 56h42" stroke="var(--bpmn-traco)" stroke-width="1.4" fill="none"/><path d="m141 56-7-4v8z" fill="var(--bpmn-traco)"/>' +
  '<rect x="143" y="34" width="112" height="44" rx="7" fill="var(--bpmn-tarefa)" stroke="var(--bpmn-tarefa-borda)" stroke-width="1.5"/>' +
  '<text x="199" y="52" text-anchor="middle" font-size="10.5" fill="var(--bpmn-texto)">Preencher pedido</text>' +
  '<text x="199" y="65" text-anchor="middle" font-size="10.5" fill="var(--bpmn-texto)">no Portal</text>' +

      '<figure class="ajuda-exemplo">' + EXEMPLO +

function irParaAjuda() {
  estado.tela = "ajuda";
  desenharAjuda();
  $("#tela-lista").hidden = true;
  $("#tela-ajuda").hidden = false;
  desenharTrilha();
  history.replaceState(null, "", "#ajuda");
  window.scrollTo(0, 0);
}

function irParaLista() {
  estado.tela = "lista";
  $("#tela-ajuda").hidden = true;
  $("#tela-lista").hidden = false;
  desenharTrilha();
  if (location.hash === "#ajuda") history.replaceState(null, "", location.pathname + location.search);
  window.scrollTo(0, 0);
}

$("#abre-ajuda").addEventListener("click", irParaAjuda);

/* ---------- Início ----------
   Os dados vivem no processos.json ao lado, e não mais dentro desta página:
   atualizar o catálogo passa a ser trocar um arquivo só. */
function rotaInicial() {
  const inicial = (location.hash || "").replace("#", "").toLowerCase();
  if (!inicial) return;
  if (inicial === "ajuda") { irParaAjuda(); return; }
  /* Link antigo, da época em que a âncora era código + posição na lista.
     Resolve pelo código e manda para a página da ficha. */
  const m = inicial.match(/^(.*)-\d+$/);
  const codigo = (m ? m[1] : inicial).replace(/-/g, ".").toUpperCase();
  const achados = PROCESSOS.filter(p => String(p.codigo).toUpperCase() === codigo);
  if (achados.length === 1) location.replace("processo.html?id=" + achados[0].id);
}

async function iniciar() {
  try {
    const r = await fetch("processos.json", { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    PROCESSOS = await r.json();
  } catch (e) {
    $("#tela-lista").innerHTML =
      '<p class="nota" style="margin:28px 0">Não foi possível carregar o catálogo agora. ' +
      'Tente recarregar a página.</p>';
    return;
  }
  PROCESSOS.sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR", { sensitivity: "base" }));
  PROCESSOS.forEach((p, i) => { p._i = i; });
  montarFiltros();
  desenharTrilha();
  aplicar();
  rotaInicial();
}

iniciar();
